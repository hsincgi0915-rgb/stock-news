name: daily-report
on:
  schedule:
    - cron: "30 9,11,13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests markdown yfinance anthropic
      - name: 產生日報
        run: python tw_stock_daily.py --out docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 儲存日報
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs
          git diff --cached --quiet || git commit -m "report $(date +%F)"
          git pull --rebase
          git push
      - name: 產生選股網頁
        run: python screener.py --out docs/screener
        continue-on-error: true
        timeout-minutes: 35
      - name: 儲存選股網頁
        run: |
          git add docs
          git diff --cached --quiet || git commit -m "screener $(date +%F)"
          git pull --rebase
          git push
