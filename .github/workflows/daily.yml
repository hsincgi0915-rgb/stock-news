name: daily-report
on:
  schedule:
    - cron: "30 9,11,13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests markdown yfinance anthropic
      - run: python tw_stock_daily.py --out docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python screener.py --out docs/screener
        continue-on-error: true
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs
          git diff --cached --quiet || (git commit -m "report $(date +%F)" && git push)
